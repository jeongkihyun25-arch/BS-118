<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>브리지스톤 트럭/버스 타이어 품질보증 서비스</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <!-- FontAwesome 아이콘 CDN 연동 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- EmailJS 라이브러리 -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("YOUR_PUBLIC_KEY");
    })();
  </script>
  <style>
    :root {
      --bs-red: #DC2626;
      --bs-red-dark: #B91C1C;
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --card-border: #334155;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --accent-blue: #3B82F6;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: break-word; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #090D16;
      color: var(--text-main);
      line-height: 1.5;
    }
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.7);
    }
    /* 헤더 디자인 */
    .app-header {
      background: #020617;
      color: #FFFFFF;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--bs-red);
      position: relative;
    }
    .app-header h1 { font-size: 22px; font-weight: 900; letter-spacing: 0.5px; font-style: italic; color: #FFF; }
    .app-header p { font-size: 13px; color: var(--text-sub); margin-top: 4px; font-weight: 500; }
    
    /* 규정 공지 배너 */
    .policy-banner {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid #F59E0B;
      padding: 14px 18px;
      font-size: 13.5px;
      color: #FCD34D;
      line-height: 1.5;
      margin: 16px 16px 0;
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .policy-banner strong { color: #F87171; }

    .content-area { padding: 20px 16px 40px; flex: 1; }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .welcome-text { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; color: var(--text-main); }
    
    /* 프리미엄 카드 버튼 (FontAwesome 아이콘 조합) */
    .big-card-btn {
      width: 100%;
      padding: 22px 20px;
      margin-bottom: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      transition: all 0.2s ease;
    }
    .big-card-btn:active { transform: scale(0.98); }
    .btn-register { border-left: 5px solid var(--bs-red); }
    .btn-claim { border-left: 5px solid var(--accent-blue); }
    
    .card-content h2 { font-size: 19px; font-weight: 800; color: #FFF; margin-bottom: 4px; }
    .card-content p { font-size: 13.5px; color: var(--text-sub); }
    .card-icon { font-size: 26px; color: var(--text-sub); opacity: 0.8; }
    .btn-register .card-icon { color: #F87171; }
    .btn-claim .card-icon { color: #60A5FA; }

    /* 네비게이션바 */
    .top-nav { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .btn-back { background: #334155; color: #FFF; border: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-right: 12px; display: flex; align-items: center; gap: 6px; }
    .screen-title { font-size: 18px; font-weight: 800; color: #FFF; }

    /* 폼 입력 디자인 */
    .form-group { margin-bottom: 22px; position: relative; }
    .form-label { display: block; font-size: 15.5px; font-weight: 700; margin-bottom: 6px; color: #E2E8F0; }
    .form-sub { display: block; font-size: 12.5px; color: var(--text-sub); margin-bottom: 8px; line-height: 1.4; }
    
    .form-input {
      width: 100%; height: 52px; padding: 0 16px; font-size: 17px; font-weight: 600;
      border: 1px solid var(--card-border); border-radius: 10px; background: #0F172A; color: #FFF;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--bs-red); outline: none; box-shadow: 0 0 0 3px rgba(220,38,38,0.2); }

    /* 대리점 자동완성 드롭다운 */
    .agency-dropdown {
      display: none; position: absolute; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto;
      background: #1E293B; border: 1px solid #475569; border-radius: 10px; margin-top: 4px; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .agency-dropdown.show { display: block; }
    .agency-item { padding: 12px 16px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #334151; color: #E2E8F0; cursor: pointer; }
    .agency-item:active { background-color: var(--bs-red); color: #FFF; }

    /* 고화질 사진 업로드 박스 (FontAwesome 카메라 아이콘) */
    .photo-upload-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 22px 14px; border: 2px dashed #475569; border-radius: var(--radius); background: #0F172A; text-align: center; cursor: pointer;
      transition: background 0.2s;
    }
    .photo-upload-box:active { background: #1E293B; }
    .photo-upload-box.done { border-style: solid; border-color: #10B981; background: rgba(6, 78, 59, 0.3); }
    .photo-upload-box input[type="file"] { display: none; }
    .camera-btn-text { font-size: 16px; font-weight: 700; color: #E2E8F0; display: flex; align-items: center; gap: 8px; }
    .camera-btn-text i { font-size: 20px; color: #60A5FA; }
    .preview-img { max-width: 100%; max-height: 180px; margin-top: 10px; border-radius: 8px; display: none; border: 1px solid #64748B; }

    /* 제출 버튼 */
    .submit-btn {
      width: 100%; height: 58px; background: var(--bs-red); color: #FFFFFF; font-size: 19px; font-weight: 900;
      border: none; border-radius: var(--radius); cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(220,38,38,0.4);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s;
    }
    .submit-btn:active { background: var(--bs-red-dark); transform: scale(0.98); }
    .submit-btn:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }

    /* 요약 카드 */
    .info-summary-card { background: #0F172A; border: 1px solid #475569; border-radius: var(--radius); padding: 16px; margin-bottom: 22px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; padding: 7px 0; border-bottom: 1px solid #1E293B; gap: 8px; }
    .info-row:last-child { border-bottom: none; }
    .info-row strong { color: #F87171; font-size: 16px; text-align: right; }

    .calc-highlight {
      background: rgba(127, 29, 29, 0.4); border: 1px solid var(--bs-red); color: #FCA5A5; padding: 12px; border-radius: 10px;
      font-size: 16px; font-weight: 800; text-align: center; margin-top: 10px; display: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <h1>BRIDGESTONE</h1>
    <p>R118 카고 트럭 타이어 품질보증 서비스</p>
  </header>
  
  <div class="policy-banner">
    📢 <strong>품질보증 규정:</strong> 구매일로부터 <strong>3개월 이내</strong>, 마모율 20% 이내 파손 타이어는 <strong>1본 이상 구매 시 1본당 1회</strong> 새 제품 교환 보장.
  </div>

  <div class="content-area">
    
    <!-- 홈 화면 -->
    <div id="screen-home" class="screen active">
      <p class="welcome-text">원하시는 서비스를 선택해 주세요</p>

      <button type="button" class="big-card-btn btn-register" onclick="showScreen('screen-register')">
        <div class="card-content">
          <span class="badge" style="background:rgba(220,38,38,0.2); color:#F87171; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700;">신규 구매 고객</span>
          <h2 style="margin-top:6px;">최초 구매 등록</h2>
          <p>영수증 및 장착 키로수 등록</p>
        </div>
        <i class="fa-solid fa-chevron-right card-icon"></i>
      </button>

      <button type="button" class="big-card-btn btn-claim" onclick="showScreen('screen-claim')">
        <div class="card-content">
          <span class="badge" style="background:rgba(59,130,246,0.2); color:#93C5FD; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700;">파손 발생 시</span>
          <h2 style="margin-top:6px;">사용자 과실 보상 접수</h2>
          <p>번호 조회 후 1본 교환 신청</p>
        </div>
        <i class="fa-solid fa-chevron-right card-icon"></i>
      </button>
    </div>

    <!-- 1. 최초 구매 등록 -->
    <div id="screen-register" class="screen">
      <div class="top-nav">
        <button type="button" class="btn-back" onclick="showScreen('screen-home')"><i class="fa-solid fa-arrow-left"></i> 뒤로</button>
        <span class="screen-title">최초 구매 등록</span>
      </div>

      <form id="form-register" autocomplete="off">
        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-phone" style="color:#60A5FA;"></i> 휴대폰 번호 입력</label>
          <span class="form-sub">보상 접수 시 본인 확인 및 이력 관리용</span>
          <input type="tel" id="reg_phone" class="form-input" inputmode="numeric" placeholder="01012345678" required>
        </div>

        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-user" style="color:#60A5FA;"></i> 고객 성함 (차량번호)</label>
          <input type="text" id="reg_name" class="form-input" placeholder="예: 홍길동 (12가3456)" required>
        </div>

        <div class="form-group" id="agency_search_wrap">
          <label class="form-label"><i class="fa-solid fa-store" style="color:#60A5FA;"></i> 구매 대리점 선택</label>
          <span class="form-sub">대리점 이름의 일부를 입력하면 목록이 표시됩니다.</span>
          <input type="text" id="reg_agency" class="form-input" placeholder="대리점 검색 (예: 북항)" onfocus="filterAgencyList()" oninput="filterAgencyList()" required>
          <div id="agency_dropdown" class="agency-dropdown"></div>
        </div>

        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-boxes-stacked" style="color:#60A5FA;"></i> 총 구매 수량 (본 수) 입력</label>
          <input type="number" id="reg_qty" class="form-input" inputmode="numeric" min="1" placeholder="예: 4" required>
        </div>

        <div class="form-group">
          <label class="form-label"><i class="fa-solid fa-gauge" style="color:#60A5FA;"></i> 장착 시점 차량 키로수 (km)</label>
          <input type="number" id="reg_km" class="form-input" inputmode="numeric" placeholder="예: 50000" required>
        </div>

        <div class="form-group">
          <label class="form-label">구매 영수증 사진</label>
          <label class="photo-upload-box" id="box_receipt">
            <span class="camera-btn-text" id="txt_receipt"><i class="fa-solid fa-camera"></i> 영수증 촬영 (고화질)</span>
            <input type="file" accept="image/*" capture="environment" onchange="processImage(this, 'prev_receipt', 'box_receipt', 'txt_receipt', 'receipt')">
            <img id="prev_receipt" class="preview-img">
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">장착 시점 계기판 사진</label>
          <label class="photo-upload-box" id="box_odo">
            <span class="camera-btn-text" id="txt_odo"><i class="fa-solid fa-camera"></i> 계기판 촬영 (고화질)</span>
            <input type="file" accept="image/*" capture="environment" onchange="processImage(this, 'prev_odo', 'box_odo', 'txt_odo', 'odo')">
            <img id="prev_odo" class="preview-img">
          </label>
        </div>

        <button type="submit" class="submit-btn" id="btn_reg_submit"><i class="fa-solid fa-check"></i> 구매 등록 완료하기</button>
      </form>
    </div>

    <!-- 2. 보상 접수 -->
    <div id="screen-claim" class="screen">
      <div class="top-nav">
        <button type="button" class="btn-back" onclick="showScreen('screen-home')"><i class="fa-solid fa-arrow-left"></i> 뒤로</button>
        <span class="screen-title">사용자 과실 보상 접수</span>
      </div>

      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-magnifying-glass" style="color:#60A5FA;"></i> 등록된 휴대폰 번호 조회</label>
        <div style="display:flex; gap:8px;">
          <input type="tel" id="claim_phone" class="form-input" inputmode="numeric" placeholder="01012345678" value="01012345678">
          <button type="button" id="btn_lookup" onclick="lookupCustomer()" style="width:110px; background:var(--accent-blue); color:#FFF; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; flex-shrink:0;"><i class="fa-solid fa-search"></i> 조회</button>
        </div>
      </div>

      <form id="form-claim" style="display:none;" autocomplete="off">
        <div class="info-summary-card">
          <div class="info-row"><span>고객명 (대리점)</span> <strong id="view_name">-</strong></div>
          <div class="info-row"><span>총 구매 수량</span> <strong id="view_qty" style="color:#60A5FA;">-</strong></div>
          <div class="info-row"><span>최초 구매일</span> <span id="view_date">-</span></div>
          <div class="info-row"><span>구매 후 경과일</span> <strong id="view_days">-</strong></div>
          <div class="info-row"><span>최초 장착 키로수</span> <span id="view_init_km">-</span></div>
        </div>

        <div class="form-group">
          <label class="form-label">1. 현재 차량 키로수 (km)</label>
          <input type="number" id="claim_curr_km" class="form-input" inputmode="numeric" placeholder="예: 62000" oninput="calculateDrivenKm()" required>
          <div id="usage_result" class="calc-highlight"></div>
        </div>

        <div class="form-group">
          <label class="form-label">2. 타이어 DOT 숫자 4자리</label>
          <span class="form-sub">옆면 DOT 맨 뒤의 숫자 4자리 입력</span>
          <input type="tel" id="claim_dot" class="form-input" inputmode="numeric" maxlength="4" placeholder="예: 3825" required>
        </div>

        <div class="form-group">
          <label class="form-label">3. 타이어 DOT 전체 사진 (알파벳 포함)</label>
          <label class="photo-upload-box" id="box_dot_photo">
            <span class="camera-btn-text" id="txt_dot_photo"><i class="fa-solid fa-camera"></i> DOT 전체 촬영 (고화질)</span>
            <input type="file" accept="image/*" capture="environment" onchange="processImage(this, 'prev_dot_photo', 'box_dot_photo', 'txt_dot_photo', 'dot_photo')">
            <img id="prev_dot_photo" class="preview-img">
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">4. 파손 부위 사진</label>
          <label class="photo-upload-box" id="box_damage">
            <span class="camera-btn-text" id="txt_damage"><i class="fa-solid fa-camera"></i> 문제 부위 촬영 (고화질)</span>
            <input type="file" accept="image/*" capture="environment" onchange="processImage(this, 'prev_damage', 'box_damage', 'txt_damage', 'damage')">
            <img id="prev_damage" class="preview-img">
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">5. 현재 계기판 사진</label>
          <label class="photo-upload-box" id="box_claim_odo">
            <span class="camera-btn-text" id="txt_claim_odo"><i class="fa-solid fa-camera"></i> 계기판 촬영 (고화질)</span>
            <input type="file" accept="image/*" capture="environment" onchange="processImage(this, 'prev_claim_odo', 'box_claim_odo', 'txt_claim_odo', 'claim_odo')">
            <img id="prev_claim_odo" class="preview-img">
          </label>
        </div>

        <button type="submit" class="submit-btn" id="btn_claim_submit"><i class="fa-solid fa-file-shield"></i> 보상 신청 완료하기</button>
      </form>
    </div>

  </div>
</div>

<script>
  const GAS_WEB_APP_URL = ""; 
  const AGENCY_LIST = [
    "(주) 태지", "(주)남영타이어 브리지스톤 남구점", "(주)뉴트럭오일교환", "(주)도개미쉐린타이어", "(주)영재",
    "(주)온누리타이어", "(주)태성운송종합상사", "KTS동아타이어", "LS타이어", "㈜국제상사",
    "㈜드래곤드림", "가락타이어", "경남대리점(김해)", "경동타이어", "경상타이어상사",
    "경인타이어", "고백자동차공업사", "고속타이어", "곰도리타이어", "공단타이어",
    "구미화물터미널", "극동오토모빌스", "금호타이어 광양점", "금호타이어 일등 대리점", "금호타이어(한진대리점)",
    "금호타이어공단대리점", "남울산판매㈜", "내륙혼타야", "늘푸른", "대소타이어정비",
    "대영타이어", "대전트럭서비스", "대하미쉐린대구총판", "대현타이어상사", "대형자동차공업사",
    "대형타이어", "대흥상사", "동구텍", "동림TDS", "동창대리점",
    "동해종합타이어", "두꺼비타이어", "마산종합타이어", "무촌자동차공업사", "미르타이어",

    "북천안타이어", "북항현대", "브리지스톤 군산대리점(전북총판)", "브리지스톤 상주점(대신자동차)", "브리지스톤동남타이어",
    "브리지스톤영천IC대리점", "브리지스톤천안", "빛가람타이어", "삼천리타이어", "삼호타이어",
    "상동타이어", "상암타이어", "새성환타이어", "서남원IC브리지스톤", "서해종합타이어",

  function filterAgencyList() {
    const input = document.getElementById('reg_agency');
    const dropdown = document.getElementById('agency_dropdown');
    const keyword = input.value.trim().toLowerCase();
    const filtered = AGENCY_LIST.filter(name => name.toLowerCase().includes(keyword));
    
    dropdown.innerHTML = filtered.length === 0 ? 
      `<div class="agency-item" onclick="selectAgency('${input.value.trim()}')">📋 '${input.value.trim()}' 직접 입력</div>` :
      filtered.map(name => `<div class="agency-item" onclick="selectAgency('${name}')">${name}</div>`).join('');
    dropdown.classList.add('show');
  }

  function selectAgency(name) {
    document.getElementById('reg_agency').value = name;
    document.getElementById('agency_dropdown').classList.remove('show');
  }

  document.addEventListener('click', function(e) {
    const wrap = document.getElementById('agency_search_wrap');
    if (wrap && !wrap.contains(e.target)) document.getElementById('agency_dropdown').classList.remove('show');
  });

  (function initSampleData() {
    const samplePhone = "01012345678";
    if (!localStorage.getItem('BS_DB_' + samplePhone)) {
      const pastDate = new Date();
      pastDate.setDate(pastDate.getDate() - 30);
      localStorage.setItem('BS_DB_' + samplePhone, JSON.stringify({
        phone: samplePhone, name: "김트럭 (화물차주)", agency: "북항현대", qty: 4, initKm: 50000, regDate: pastDate.toISOString().slice(0, 10), claimed: false
      }));
    }
  })();

  const photoData = { receipt: "", odo: "", dot_photo: "", damage: "", claim_odo: "" };
  let activeCustomer = null;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function processImage(input, previewId, boxId, txtId, key) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_W = 1600;
        let w = img.width, h = img.height;
        if (w > MAX_W) { h = Math.round(h * (MAX_W / w)); w = MAX_W; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.85);
        photoData[key] = compressed;

        const prev = document.getElementById(previewId);
        prev.src = compressed;
        prev.style.display = 'block';
        document.getElementById(boxId).classList.add('done');
        document.getElementById(txtId).innerHTML = `<i class="fa-solid fa-circle-check" style="color:#10B981;"></i> 고화질 촬영 완료`;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('form-register').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn_reg_submit');
    btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 저장 및 전송 중...`;

    const phone = document.getElementById('reg_phone').value.replace(/[^0-9]/g, '');
    const name = document.getElementById('reg_name').value.trim();
    const agency = document.getElementById('reg_agency').value.trim();
    const qty = parseInt(document.getElementById('reg_qty').value, 10) || 1;
    const initKm = parseInt(document.getElementById('reg_km').value, 10) || 0;
    const regDate = new Date().toISOString().slice(0, 10);

    const record = { action: "register", phone, name, agency, qty, initKm, regDate, claimed: false };
    localStorage.setItem('BS_DB_' + phone, JSON.stringify(record));

    try {
      if (GAS_WEB_APP_URL) {
        await fetch(GAS_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(record) });
      }
      await emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
        title: "[브리지스톤 품질보증] 신규 구매 등록 알림",
        type: "최초구매등록", phone, name, agency, qty: qty + "본",
        init_km: initKm.toLocaleString() + " km", reg_date: regDate
      });

      alert(`✅ [${name}]님 (${qty}본 구매) 최초 등록이 완료되었습니다!`);
      document.getElementById('claim_phone').value = phone;
      showScreen('screen-home');
    } catch (err) {
      alert("기기에 안전하게 저장되었습니다.");
      showScreen('screen-home');
    } finally {
      btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-check"></i> 구매 등록 완료하기`;
    }
  });

  async function lookupCustomer() {
    const phone = document.getElementById('claim_phone').value.replace(/[^0-9]/g, '');
    if (phone.length < 8) { alert("휴대폰 번호를 정확히 입력해 주세요."); return; }

    const btn = document.getElementById('btn_lookup');
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`; btn.disabled = true;

    let foundRecord = null;
    if (GAS_WEB_APP_URL) {
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?phone=${encodeURIComponent(phone)}`);
        const json = await res.json();
        if (json && json.found) foundRecord = json.data;
      } catch (e) {}
    }

    if (!foundRecord) {
      const local = localStorage.getItem('BS_DB_' + phone);
      if (local) foundRecord = JSON.parse(local);
    }

    btn.innerHTML = `<i class="fa-solid fa-search"></i> 조회`; btn.disabled = false;

    if (!foundRecord) {
      alert("등록된 구매 내역이 없습니다. [최초 구매 등록]을 먼저 진행해 주세요.");
      return;
    }

    if (foundRecord.claimed) {
      alert("⚠️ 안내: 해당 번호는 이미 1본 교환 보상 서비스를 지원받아 추가 접수가 불가합니다.");
      return;
    }

    const regDateObj = new Date(foundRecord.regDate);
    const diffDays = Math.max(0, Math.floor((new Date() - regDateObj) / (1000 * 60 * 60 * 24)));

    if (diffDays > 90) {
      alert(`⚠️ 안내: 구매일로부터 ${diffDays}일이 경과하여 품질보증 기간(3개월)이 만료되었습니다.`);
    }

    activeCustomer = { ...foundRecord, diffDays, drivenKm: 0 };
    document.getElementById('view_name').innerText = `${foundRecord.name} (${foundRecord.agency})`;
    document.getElementById('view_qty').innerText = `${foundRecord.qty || 1}본 구매 (보상 한도: 1본 1회)`;
    document.getElementById('view_date').innerText = foundRecord.regDate;
    document.getElementById('view_days').innerText = `구매 후 ${diffDays}일 경과`;
    document.getElementById('view_init_km').innerText = `${Number(foundRecord.initKm).toLocaleString()} km`;
    document.getElementById('form-claim').style.display = 'block';
    calculateDrivenKm();
  }

  function calculateDrivenKm() {
    if (!activeCustomer) return;
    const currKm = parseInt(document.getElementById('claim_curr_km').value, 10);
    const box = document.getElementById('usage_result');
    if (!isNaN(currKm)) {
      const driven = currKm - Number(activeCustomer.initKm);
      box.style.display = 'block';
      if (driven >= 0) {
        box.innerText = `📊 총 ${driven.toLocaleString()} km 주행 (${activeCustomer.diffDays}일 경과)`;
        activeCustomer.drivenKm = driven;
        activeCustomer.currKm = currKm;
      } else {
        box.innerText = `⚠️ 최초 장착 키로수보다 큰 숫자를 입력하세요.`;
        activeCustomer.drivenKm = 0;
      }
    } else { box.style.display = 'none'; }
  }

  document.getElementById('form-claim').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!activeCustomer) return;

    const btn = document.getElementById('btn_claim_submit');
    btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 전송 중...`;

    const dotNo = document.getElementById('claim_dot').value.trim();
    if (dotNo.length !== 4) { alert("DOT 숫자 4자리를 정확히 입력해 주세요."); btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-file-shield"></i> 보상 신청 완료하기`; return; }

    activeCustomer.claimed = true;
    localStorage.setItem('BS_DB_' + activeCustomer.phone, JSON.stringify(activeCustomer));

    const payload = {
      action: "claim",
      phone: activeCustomer.phone,
      name: activeCustomer.name,
      agency: activeCustomer.agency,
      regDate: activeCustomer.regDate,
      elapsedDays: `${activeCustomer.diffDays}일 경과`,
      initKm: activeCustomer.initKm,
      currKm: activeCustomer.currKm || 0,
      drivenKm: activeCustomer.drivenKm || 0,
      dotNo: dotNo
    };

    try {
      if (GAS_WEB_APP_URL) {
        await fetch(GAS_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
      }
      await emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
        title: "[브리지스톤 품질보증] 사용자 과실 보상 접수 알림",
        type: "타이어보상접수",
        phone: payload.phone, name: payload.name, agency: payload.agency,
        qty: (activeCustomer.qty || 1) + "본 중 1본 신청",
        init_km: Number(payload.initKm).toLocaleString() + " km",
        reg_date: payload.regDate, elapsed_days: payload.elapsedDays,
        driven_km: `총 ${Number(payload.drivenKm).toLocaleString()} km 주행`,
        dot_no: payload.dotNo
      });

      alert(`✅ 보상 신청이 완료되어 담당자 메일로 전송되었습니다!\n\n• 주행거리: ${Number(payload.drivenKm).toLocaleString()} km\n• DOT 4자리: ${payload.dotNo}`);
      showScreen('screen-home');
    } catch (err) {
      alert("보상 접수 내역이 안전하게 저장되었습니다.");
      showScreen('screen-home');
    } finally {
      btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-file-shield"></i> 보상 신청 완료하기`;
    }
  });
</script>
